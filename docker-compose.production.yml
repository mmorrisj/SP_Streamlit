# ============================================
# Production Deployment - Docker Hub Images Only
# Pulls all images from Docker Hub (no local builds)
#
# Usage:
#   # First time — run migrations:
#   docker compose -f docker-compose.production.yml --profile migrate up
#
#   # Start the stack:
#   docker compose -f docker-compose.production.yml up -d
#
#   # Tear down (preserves data):
#   docker compose -f docker-compose.production.yml down
#
#   # Tear down and reset all data:
#   docker compose -f docker-compose.production.yml down -v
# ============================================

name: softpower_production

services:
  # -----------------------
  # PostgreSQL + pgvector
  # -----------------------
  db:
    image: mmorrisj/pgvector:0.8.1-pg16
    container_name: sp_prod_db
    restart: unless-stopped
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------
  # Redis Cache
  # Replace image with your enterprise hardened Redis image if required
  # e.g., dhi/redis:7
  # -----------------------
  redis:
    image: redis:7-alpine
    container_name: sp_prod_redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    networks:
      - prod_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------
  # SoftPower Analytics (FastAPI + Streamlit via supervisord)
  # Single consolidated container from Docker Hub
  # -----------------------
  app:
    image: mmorrisj/softpower-analytics:1.6.2
    container_name: sp_prod_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DOCKER_ENV: "true"
      DB_HOST: sp_prod_db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_HOST: sp_prod_db
      POSTGRES_PORT: 5432
      # NOTE: If POSTGRES_PASSWORD contains special chars (@, /, #, %), they must
      # be URL-encoded here. The app also builds the URL from individual vars
      # (with auto-encoding) so you can omit DATABASE_URL entirely.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@sp_prod_db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      API_PORT: 8000
      # Host-side proxy for LLM/S3 calls (run uvicorn server.main:app on host)
      # LLM_PROXY_PORT defaults to 7001; set LLM_PROXY_PORT in .env to override
      API_URL: http://host.docker.internal:${LLM_PROXY_PORT:-7001}
      S3_PROXY_URL: http://host.docker.internal:${LLM_PROXY_PORT:-7001}
      USE_S3_API_CLIENT: "true"
      # Pass through credentials from .env (will be empty if not set)
      CLAUDE_KEY: ${CLAUDE_KEY:-}
      OPENAI_PROJ_API: ${OPENAI_PROJ_API:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Connection pooling
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      # HuggingFace offline mode (model baked into image)
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      HF_HOME: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/huggingface/hub
      REDIS_URL: redis://sp_prod_redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-softpower-jwt-secret-change-in-production-min32chars}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
    ports:
      - "${API_PORT:-8000}:8000"   # FastAPI (React UI + API)
      - "${STREAMLIT_PORT:-8501}:8501"   # Streamlit Dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prod_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -----------------------
  # Alembic Migrations (run once with --profile migrate)
  # -----------------------
  migrate:
    image: mmorrisj/softpower-analytics:1.6.2
    container_name: sp_prod_migrate
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DOCKER_ENV: "true"
      DB_HOST: sp_prod_db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      # NOTE: If POSTGRES_PASSWORD contains special chars (@, /, #, %), they must
      # be URL-encoded here. The app also builds the URL from individual vars
      # (with auto-encoding) so you can omit DATABASE_URL entirely.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@sp_prod_db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    command: alembic upgrade head
    networks:
      - prod_net
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

# -----------------------
# Persistent Volumes and Network
# Pin names explicitly so docker-compose and production-deploy.sh
# always reference the exact same Docker objects.
# -----------------------
volumes:
  prod_pgdata:
    name: softpower_production_prod_pgdata

networks:
  prod_net:
    name: softpower_net
