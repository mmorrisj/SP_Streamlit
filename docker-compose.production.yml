# ============================================
# Production Deployment - Docker Hub Images Only
# Pulls all images from Docker Hub (no local builds)
#
# Usage:
#   # First time — run migrations:
#   docker compose -f docker-compose.production.yml --profile migrate up
#
#   # Start the stack:
#   docker compose -f docker-compose.production.yml up -d
#
#   # Tear down (preserves data):
#   docker compose -f docker-compose.production.yml down
#
#   # Tear down and reset all data:
#   docker compose -f docker-compose.production.yml down -v
# ============================================

name: softpower_production

services:
  # -----------------------
  # PostgreSQL + pgvector
  # -----------------------
  db:
    image: mmorrisj/pgvector:0.8.1-pg16
    container_name: sp_prod_db
    restart: unless-stopped
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-softpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-softpower-db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-softpower} -d ${POSTGRES_DB:-softpower-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------
  # Redis
  # -----------------------
  redis:
    image: redis:7-alpine
    container_name: sp_prod_redis
    restart: unless-stopped
    networks:
      - prod_net

  # -----------------------
  # SoftPower Analytics (FastAPI + Streamlit via supervisord)
  # Single consolidated container from Docker Hub
  # -----------------------
  app:
    image: mmorrisj/softpower-analytics:1.5.3
    container_name: sp_prod_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DOCKER_ENV: "true"
      DB_HOST: sp_prod_db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-softpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-softpower-db}
      POSTGRES_HOST: sp_prod_db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-softpower}:${POSTGRES_PASSWORD:-changeme}@sp_prod_db:5432/${POSTGRES_DB:-softpower-db}
      REDIS_URL: redis://sp_prod_redis:6379
      API_PORT: 8000
      # Host-side proxy for LLM/S3 calls (run uvicorn server.main:app on host)
      API_URL: http://host.docker.internal:${API_PORT:-7001}
      S3_PROXY_URL: http://host.docker.internal:${API_PORT:-7001}
      USE_S3_API_CLIENT: "true"
      # Pass through credentials from .env (will be empty if not set)
      CLAUDE_KEY: ${CLAUDE_KEY:-}
      OPENAI_PROJ_API: ${OPENAI_PROJ_API:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-softpower-jwt-secret-change-in-production-min32chars}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
    ports:
      - "8000:8000"   # FastAPI (React UI + API)
      - "8501:8501"   # Streamlit Dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prod_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # -----------------------
  # Alembic Migrations (run once with --profile migrate)
  # -----------------------
  migrate:
    image: mmorrisj/softpower-analytics:1.5.3
    container_name: sp_prod_migrate
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DOCKER_ENV: "true"
      DB_HOST: sp_prod_db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-softpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-softpower-db}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-softpower}:${POSTGRES_PASSWORD:-changeme}@sp_prod_db:5432/${POSTGRES_DB:-softpower-db}
    command: alembic upgrade head
    networks:
      - prod_net
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

# -----------------------
# Persistent Volumes and Network
# -----------------------
volumes:
  prod_pgdata:

networks:
  prod_net:
