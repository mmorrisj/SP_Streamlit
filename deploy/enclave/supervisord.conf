; Supervisord config for the enclave deployment.
; Started by deploy/enclave/start.sh, which exports the env vars referenced
; below (PGDATA, RUN_DIR, LOG_DIR, APP_ROOT, PGPORT, REDIS_PORT, API_HOST,
; API_PORT, UVICORN_WORKERS, REDIS_CONF, ENCLAVE_DATA).
;
; All three programs run in foreground so supervisord owns their lifecycle.

[supervisord]
nodaemon=true
logfile=%(ENV_LOG_DIR)s/supervisord.log
pidfile=%(ENV_RUN_DIR)s/supervisord.pid
loglevel=info

[unix_http_server]
file=%(ENV_RUN_DIR)s/supervisor.sock

[supervisorctl]
serverurl=unix://%(ENV_RUN_DIR)s/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:postgres]
command=postgres -D %(ENV_PGDATA)s -h 127.0.0.1 -p %(ENV_PGPORT)s -k %(ENV_RUN_DIR)s
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=10
stdout_logfile=%(ENV_LOG_DIR)s/postgres.log
stderr_logfile=%(ENV_LOG_DIR)s/postgres.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:redis]
command=redis-server %(ENV_REDIS_CONF)s --port %(ENV_REDIS_PORT)s --dir %(ENV_ENCLAVE_DATA)s/redis
autostart=true
autorestart=true
startretries=5
startsecs=3
priority=20
stdout_logfile=%(ENV_LOG_DIR)s/redis.log
stderr_logfile=%(ENV_LOG_DIR)s/redis.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:fastapi]
command=uvicorn server.main:app --host %(ENV_API_HOST)s --port %(ENV_API_PORT)s --workers %(ENV_UVICORN_WORKERS)s
directory=%(ENV_APP_ROOT)s
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=30
stdout_logfile=%(ENV_LOG_DIR)s/fastapi.log
stderr_logfile=%(ENV_LOG_DIR)s/fastapi.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONPATH="%(ENV_APP_ROOT)s"
