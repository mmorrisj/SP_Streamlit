# Redis config for the enclave deployment.
# Paths and ports are templated by deploy/enclave/start.sh from .env vars.
#
# Bind to loopback only — the FastAPI process is on the same host as redis.
bind 127.0.0.1
protected-mode yes

# Port and dir are overridden on the command line from start.sh:
#   redis-server redis.conf --port $REDIS_PORT --dir $ENCLAVE_DATA/redis
port 6379
dir /tmp

# Persist with AOF — survives restarts without a long RDB save pause.
appendonly yes
appendfsync everysec

# Limit memory; evict LRU keys when full. Adjust for the kiosk's RAM budget.
maxmemory 512mb
maxmemory-policy allkeys-lru

# Disable RDB snapshots (AOF is enough; saves CPU).
save ""

# Logging to stdout so supervisord captures it.
logfile ""
loglevel notice
