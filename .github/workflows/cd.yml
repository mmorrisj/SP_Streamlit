# ===========================================
# CD Pipeline - Deploy on main branch
# ===========================================
name: CD

on:
  push:
    branches: [main]
    # Only deploy when these paths change
    paths:
      - 'services/**'
      - 'shared/**'
      - 'server/**'
      - 'client/**'
      - 'docker/**'
      - 'requirements.txt'
      - 'docker-compose*.yml'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io  # GitHub Container Registry (free with GitHub)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -----------------------------------------
  # Job 1: Build and Push to Registry
  # -----------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to push to ghcr.io

    outputs:
      api_image: ${{ steps.meta-api.outputs.tags }}
      dashboard_image: ${{ steps.meta-dashboard.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # Auto-provided by GitHub

      # --- API Image ---
      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Dashboard Image ---
      - name: Extract metadata for Dashboard
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/dashboard.Dockerfile
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------
  # Job 2: Deploy to Server (SSH)
  # -----------------------------------------
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ vars.DEPLOY_URL }}  # Set in GitHub environment settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/softpower
            
            # Pull latest images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard:latest
            
            # Update and restart
            docker-compose pull
            docker-compose up -d --remove-orphans
            
            # Run migrations
            docker-compose --profile migrate run --rm migrate
            
            # Health check
            sleep 10
            curl -f http://localhost:${API_PORT:-8000}/health || exit 1
            curl -f http://localhost:8501/_stcore/health || exit 1
            
            echo "✅ Deployment complete"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed!"
          # Add Slack/Discord webhook here if desired
