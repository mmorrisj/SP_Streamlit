# ===========================================
# Release: build & push the production registry image
# ===========================================
# Builds docker/registry.Dockerfile (the consolidated production app image
# used by docker-compose.production.yml) and pushes it to Docker Hub as
# mmorrisj/softpower-analytics:<version> + :latest.
#
# This is the CI counterpart of scripts/docker/push-to-registry.sh, so a
# release no longer requires a local Docker daemon.
#
# Trigger any of three ways:
#   * push a tag:             git tag v1.8.11 && git push origin v1.8.11
#   * push a release branch:  git push origin main:release/v1.8.11
#     (exists because some environments can push branches but not tags)
#   * manual dispatch:        Actions -> "Release Registry Image" -> Run workflow
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   Docker Hub username (e.g. mmorrisj)
#   DOCKERHUB_TOKEN      Docker Hub access token with write scope
name: Release Registry Image

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 1.8.11)'
        required: true
        type: string

env:
  IMAGE: docker.io/mmorrisj/softpower-analytics

jobs:
  build-and-push:
    name: Build & Push ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == release/v* ]]; then
            # release branch (release/v1.8.11 -> 1.8.11)
            VERSION="${GITHUB_REF_NAME#release/v}"
          else
            # tag (v1.8.11 -> 1.8.11)
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push registry image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/registry.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            CACHEBUST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed ${IMAGE}:${{ steps.version.outputs.version }} (+ :latest)" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: update APP_IMAGE/.env or docker-compose.production.yml and run scripts/docker/production-deploy.sh" >> "$GITHUB_STEP_SUMMARY"
