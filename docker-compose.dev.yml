# ============================================
#  SoftPower Streamlit / Backend / PGVector Stack
# ============================================

name: softpower_streamlit_dev

services:
  # -----------------------
  # PostgreSQL + pgvector
  # -----------------------
  db:
    image: mmorrisj/pgvector:0.8.1-pg16
    container_name: softpower_db
    restart: unless-stopped
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - softpower_net

  # -----------------------
  # Streamlit Dashboard
  # -----------------------
  dashboard:
    image: softpower_streamlit-dashboard:latest
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    container_name: streamlit-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCKER_ENV: "true"
      DB_HOST: softpower_db
      DB_PORT: 5432
      POSTGRES_HOST: softpower_db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg2://matthew50:softpower@softpower_db:5432/softpower-db
      API_URL: http://host.docker.internal:${API_PORT:-8000}
    ports:
      - "8501:8501"
    volumes:
      - ./services/dashboard:/app/services/dashboard
      - ./shared:/app/shared
      - app_output:/app/output
    networks:
      - softpower_net
    depends_on:
      - api

  # -----------------------
  # FastAPI API Service (Serves React UI + API endpoints)
  # -----------------------
  api:
    image: softpower_streamlit-api:latest
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: api-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCKER_ENV: "true"
      DB_HOST: softpower_db
      DB_PORT: 5432
      POSTGRES_HOST: softpower_db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg2://matthew50:softpower@softpower_db:5432/softpower-db
      # Override API_PORT inside container so uvicorn binds to 8000 (matching EXPOSE/port mapping)
      # S3_PROXY_URL/API_URL point to the host-side FastAPI for S3/Batch operations
      API_PORT: 8000
      S3_PROXY_URL: http://host.docker.internal:${API_PORT:-7001}
      API_URL: http://host.docker.internal:${API_PORT:-7001}
      USE_S3_API_CLIENT: "true"
      BATCH_SCRATCHPAD_DIR: ./services/pipeline/batch/batches
    ports:
      - "${API_PORT:-7001}:8000"
    volumes:
      - ./server:/app/server                      # React-serving API + S3/Batch proxy
      - ./services/pipeline:/app/services/pipeline
      - ./shared:/app/shared
      - ./scripts:/app/scripts                    # Admin scripts
      # Note: client/dist is built inside Docker image (multi-stage build)
      # For frontend hot-reload during development, run: cd client && npm run dev
      - ./data:/app/data
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./publications:/app/publications          # Summary publications output
      - app_output:/app/output
    networks:
      - softpower_net
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # -----------------------
  # Redis (for Celery / caching)
  # -----------------------
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    networks:
      - softpower_net

  # -----------------------
  # Alembic Migrations (run with `--profile migrate`)
  # -----------------------
  migrate:
    image: softpower_streamlit-api:latest
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: alembic-migrate
    env_file:
      - .env
    environment:
      DOCKER_ENV: "true"
      DB_HOST: softpower_db
      POSTGRES_HOST: softpower_db
      DB_PORT: 5432
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg2://matthew50:softpower@softpower_db:5432/softpower-db
    command: alembic upgrade head
    depends_on:
      - db
    networks:
      - softpower_net
    volumes:
      - ./shared:/app/shared
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    profiles:
      - migrate

# -----------------------
# Persistent Volumes
# -----------------------
volumes:
  postgres_data:
    external: true
    name: softpower_streamlit_dev_postgres_data
  app_output:
    driver: local

# -----------------------
# Shared Network
# -----------------------
networks:
  softpower_net:
    external: true

