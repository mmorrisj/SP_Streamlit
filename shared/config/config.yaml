db_path: './data/softpower.db'
db_schema: './sql/schema.sql'
gai_data: './gai_summary/data'
gai_json: './gai_summary/json'
dsr_data: './data'
start_date: '2024-08-01'
sql: './sql'
report_directory: './'
# Top-level default model — read by the summary generators via config.default_model
default_model: "gpt-4.1-mini"
aws:
  secret_name: "AZURE_OPENAI_API_KEY_NORTHCENTRALUS"
  region_name: "us-east-1"
  api_version: "2024-08-01-preview"
  4_1_model: gpt-4.1-mini
  4_1_version: '2025-04-14'
  default_model: "gpt-4.1-mini"

# S3 Configuration - Override these for different environments
s3:
  bucket: "morris-sp-bucket"
  region: "us-east-1"
  prefixes:
    dsr_extracts: "dsr_extracts/"
    embeddings: "embeddings/"
    exports: "exports/"
    backups: "backups/"

text_field: 'BODY'
identifier: 'ATOM ID'
gai_output: 'GAI Output'
chunk_dedup: 'ATOM ID'
chunk_size: 1000
max_records: 300
summary_sample_percentage: .5
sample_data: True
sample_size: 10
delete_after_processing: False
create_sample: False
atom_collection: 'ne_auto'

event_models:
  - 'all-MiniLM-L6-v2'
  - 'paraphrase-mpnet-base-v2'
  - 'paraphrase-distilroberta-base-v1'
  - 'paraphrase-MiniLM-L6-v2'
    
projects:
  model: 'all-MiniLM-L6-v2'
  batch_size: 1000
  eps: 0.4
  min_samples: 2
  metric: 'cosine'
  
rag:
  chat_document_limit: 50        # Max documents returned for chat queries
  entity_match_limit: 15         # Max entities to match per query
  entity_boost_factor: 0.15      # Relevance boost for entity-matched docs
  fuzzy_match_threshold: 0.7     # pg_trgm similarity threshold
  semantic_match_threshold: 0.6  # Embedding cosine similarity threshold
  max_context_tokens: 80000      # Token budget for context (model-aware packing)
  max_full_text_docs: 8          # Top-N docs get full text; rest get truncated
  truncated_doc_chars: 500       # Chars per doc beyond top-N
  enable_reranking: true         # Cross-encoder reranking after retrieval
  rerank_model: 'cross-encoder/ms-marco-MiniLM-L-6-v2'  # Local cross-encoder (no API cost, ~90MB vs 2.2GB)
  rerank_top_k: 15               # How many docs to keep after reranking
  rerank_candidate_k: 50         # How many docs to fetch before reranking
  enable_hyde: true              # Hypothetical Document Embeddings for query expansion
  hyde_model: 'gpt-4o-mini'      # Cheap model for HyDE hypothesis generation
  enable_hybrid_search: true     # BM25 + vector fusion via PostgreSQL tsvector
  hybrid_bm25_weight: 0.3        # Weight for BM25 score in RRF fusion
  hybrid_vector_weight: 0.7      # Weight for vector score in RRF fusion

cluster:
  threshold: 50
  event_threshold: 50
  max_passes: 5
  metric: 'cosine'
  eps: 0.55
  eps_decay: 0.1
  min_samples: 2
  refine_clusters: True
  text_columns:
    - event-name
    - distilled-text
    - salience-justification

eval:
    tasks:
      salience: Salience
      category: Category
      subcategory: Subcategory
      init_country: Initiating_Country
      rec_country: Recipient_Country
    meta_fields:
      - 'ATOM ID'
      - 'BODY'
      - 'Distilled_Text'
      
influencers:
  - China
  - Russia
  - Iran
  - Turkey
  - United States

recipients:
  - Bahrain
  - Cyprus
  - Egypt
  - Iran
  - Iraq
  - Israel
  - Jordan
  - Kuwait
  - Lebanon
  - Libya
  - Oman
  - Palestine
  - Qatar
  - Saudi Arabia
  - Syria
  - Turkey
  - United Arab Emirates
  - UAE
  - Yemen

categories:
  - Economic
  - Social
  - Military
  - Diplomacy
 
subcategories:
